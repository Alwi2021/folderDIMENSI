<!DOCTYPE html> <html 
lang="id"> <head>
    <meta charset="UTF-8"> 
    <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> 
    <title>IndramayuCLUB | 
    Piramida Guard</title> 
    <script 
    src="https://cdn.tailwindcss.com"></script> 
    <style>
        @import 
        url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap'); 
        body { font-family: 
        'Plus Jakarta Sans', 
        sans-serif; 
        background-color: 
        #f3f4f6; overflow-x: 
        hidden; } 
        .purple-gradient { 
        background: 
        linear-gradient(135deg, 
        #6d28d9 0%, #4c1d95 
        100%); } .card { 
        background: white; 
        border-radius: 12px; 
        padding: 12px; 
        display: flex; 
        flex-direction: 
        column; align-items: 
        center; 
        justify-content: 
        center; cursor: 
        pointer; transition: 
        0.3s; border: 1px 
        solid #e5e7eb; } 
        .card:active { 
        transform: 
        scale(0.95); 
        background: #f9fafb; 
        }
        .nur-id { 
        font-weight: 800; 
        font-size: 10px; 
        color: #4a148c; 
        margin-top: 8px; 
        text-transform: 
        uppercase; }
        
        /* Curtain System */
        #curtain-container { 
        #position: fixed; 
        #top: 0; left: 0; 
        #width: 100%; height: 
        #100%; background: 
        ##000; z-index: 9999; 
        #display: flex; 
        #flex-direction: 
        #column; 
        #justify-content: 
        #center; align-items: 
        #center; transition: 
        #1.5s 
        #cubic-bezier(0.7, 0, 
        #0.3, 1); }
        .curtain-open { 
        transform: 
        translateY(-100%); }
    </style> </head> <body> 
    <div 
    id="curtain-container">
        <div 
        style="width:90%; 
        max-width:400px; 
        aspect-ratio:9/16; 
        border: 2px solid 
        #6d28d9; 
        border-radius: 15px; 
        overflow: hidden;">
            <iframe 
            id="yt-player" 
            width="100%" 
            height="100%" 
            src="https://www.youtube.com/embed/8LHWDtStUTk?autoplay=1&mute=1&loop=1&playlist=8LHWDtStUTk" 
            frameborder="0" 
            allow="autoplay"></iframe>
        </div> <button 
        onclick="bukaTirai()" 
        class="mt-8 
        bg-purple-600 
        text-white px-10 py-4 
        rounded-full 
        font-extrabold 
        shadow-2xl 
        hover:bg-purple-700 
        transition 
        tracking-widest">BUKA 
        SISTEM</button>
    </div> <header 
    class="purple-gradient 
    text-white p-4 shadow-lg 
    sticky top-0 z-50">
        <div class="max-w-md 
        mx-auto flex 
        justify-between 
        items-center">
            <h1 
            class="font-extrabold 
            text-lg">Indramayu<span 
            class="text-purple-200">CLUB</span></h1> 
            <div id="clock" 
            class="text-xs 
            font-mono 
            bg-purple-900/50 
            px-3 py-1 
            rounded-full">00:00:00</div>
        </div> </header> 
    <main class="max-w-md 
    mx-auto p-4 space-y-6">
        <div 
        class="bg-red-500 
        text-white p-4 
        rounded-xl 
        text-[10px] font-bold 
        border-l-4 
        border-red-700 
        shadow-md 
        animate-pulse">
            ⚠️ PIRAMIDA GUARD 
            AKTIF: FOLDER A-J 
            DALAM PENGAWASAN 
            NUR.
        </div> <h2 
        class="text-purple-900 
        font-extrabold 
        text-xs uppercase 
        tracking-widest">Pusat 
        Gerbang Digital</h2> 
        <div class="grid 
        grid-cols-3 gap-3">
            <div class="card" 
            onclick="location.href='folder_A/'">
                <div 
                class="w-10 
                h-10 
                bg-purple-100 
                rounded-full 
                flex 
                items-center 
                justify-center 
                text-purple-600 
                font-bold">A</div> 
                <span 
                class="nur-id">Folder 
                A</span>
            </div> <div 
            class="card" 
            onclick="location.href='folder_G/'">
                <div 
                class="w-10 
                h-10 
                bg-cyan-100 
                rounded-full 
                flex 
                items-center 
                justify-center 
                text-cyan-600 
                font-bold">G</div> 
                <span 
                class="nur-id">Folder 
                G</span>
            </div> <div 
            class="card" 
            onclick="location.href='folder_J/'">
                <div 
                class="w-10 
                h-10 
                bg-indigo-100 
                rounded-full 
                flex 
                items-center 
                justify-center 
                text-indigo-600 
                font-bold">J</div> 
                <span 
                class="nur-id">Folder 
                J</span>
            </div> </div> 
    </main> <script>
        function bukaTirai() 
        {
            document.getElementById('curtain-container').classList.add('curtain-open');
        }
        function updateTime() 
        {
            const now = new 
            Date(); 
            document.getElementById('clock').innerText 
            = 
            now.toLocaleTimeString('id-ID');
        }
        setInterval(updateTime, 
        1000);
    </script> </body> </html>
